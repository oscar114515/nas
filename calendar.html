<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d11">
<title>Oscar 日曆</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#141922; --panel2:#1a212c; --line:#242d3a;
    --text:#e9ecf2; --dim:#8a93a6; --accent:#5b9dff;
    --today:#ffb454; --evt:#4fd1a5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.5 -apple-system,"Segoe UI","Microsoft JhengHei","PingFang HK",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none !important}

  #root{height:100%;display:flex;flex-direction:column;padding:2.2vh 2.4vh;gap:1.8vh;cursor:none}
  #root.showcursor{cursor:default}

  .rowtop{display:flex;align-items:stretch;gap:1.8vh;flex:0 0 auto}

  .clockbox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:2vh 2.6vh;display:flex;flex-direction:column;justify-content:center}
  #clock{font-size:clamp(52px,10.5vh,124px);line-height:1;font-weight:300;
    letter-spacing:.02em;font-variant-numeric:tabular-nums}
  #clock small{font-size:.32em;color:var(--dim);margin-left:.4em;font-weight:400}
  #dateline{margin-top:1.2vh;color:var(--dim);font-size:clamp(14px,2.2vh,22px)}
  #dateline b{color:var(--text);font-weight:500}

  .wbox{flex:0 0 34%;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:2vh 2.4vh;display:flex;flex-direction:column;justify-content:center;gap:.6vh}
  .wnow{display:flex;align-items:center;gap:1.4vh}
  .wtemp{font-size:clamp(34px,6.5vh,74px);line-height:1;font-weight:300}
  .wdesc{font-size:clamp(13px,2vh,20px);color:var(--dim)}
  .wsub{font-size:clamp(12px,1.8vh,17px);color:var(--dim)}
  .wdays{display:flex;gap:1.6vh;margin-top:1vh;font-size:clamp(11px,1.7vh,16px);color:var(--dim)}
  .wdays div{white-space:nowrap}

  .mid{flex:1;display:flex;gap:1.8vh;min-height:0}

  .cal{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:1.6vh 2vh;display:flex;flex-direction:column;min-height:0}
  .calhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.8vh}
  .calhead h2{margin:0;font-size:clamp(17px,2.9vh,30px);font-weight:500;letter-spacing:.04em}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;
    font-size:clamp(11px,1.7vh,15px);color:var(--dim);padding-bottom:.5vh}
  .grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:.5vh;min-height:0}
  .cell{border-radius:9px;padding:.5vh .6vh;overflow:hidden;
    display:flex;flex-direction:column;gap:2px;min-height:0}
  .cell.other{opacity:.26}
  .cell.today{background:#2a2314;outline:1px solid var(--today)}
  .cell .d{font-size:clamp(13px,2.1vh,21px);font-weight:500;font-variant-numeric:tabular-nums}
  .cell.today .d{color:var(--today)}
  .cell .e{font-size:clamp(10px,1.55vh,14px);color:#0d1117;background:var(--evt);
    border-radius:4px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .side{flex:0 0 30%;display:flex;flex-direction:column;gap:1.8vh;min-height:0}
  .pane{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:1.6vh 2vh;display:flex;flex-direction:column;min-height:0}
  .pane h3{margin:0 0 .9vh;font-size:clamp(13px,2.1vh,19px);font-weight:500;color:var(--dim);
    letter-spacing:.06em;text-transform:uppercase}
  .evlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.7vh;min-height:0}
  .ev{display:flex;gap:1vh;align-items:baseline;font-size:clamp(12px,1.9vh,17px)}
  .ev .t{color:var(--accent);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .ev .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .x{cursor:pointer;color:var(--dim);flex:0 0 auto;padding:0 .4vh;opacity:0;transition:opacity .15s}
  .ev:hover .x{opacity:1}
  .ev .x:hover{color:#ff8b8b}

  .addbar{display:flex;gap:.8vh;margin-top:1vh;flex-wrap:wrap}
  .addbar input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:.7vh .9vh;font-size:clamp(12px,1.8vh,16px);outline:none;min-width:0}
  .addbar input:focus{border-color:var(--accent)}
  .addbar .d1{flex:0 0 34%}
  .addbar .t1{flex:0 0 18%}
  .addbar .n1{flex:1}
  .addbar button{background:var(--accent);border:1px solid var(--accent);color:#fff;
    border-radius:8px;padding:.7vh 1.4vh;cursor:pointer;font-size:clamp(12px,1.8vh,16px)}
  .addbar button:active{transform:translateY(1px)}

  .note{color:var(--dim);font-size:clamp(11px,1.7vh,15px)}
  .warn{color:#ffb454;font-size:clamp(11px,1.7vh,15px)}
</style>
</head>
<body>

<div id="root" class="hidden">
  <div class="rowtop">
    <div class="clockbox">
      <div id="clock">--:--<small id="sec"></small></div>
      <div id="dateline"></div>
    </div>
    <div class="wbox" id="wbox">
      <div class="wnow">
        <div class="wtemp" id="wtemp">--°</div>
        <div>
          <div class="wdesc" id="wdesc">載入天氣…</div>
          <div class="wsub" id="wsub"></div>
        </div>
      </div>
      <div class="wdays" id="wdays"></div>
    </div>
  </div>

  <div class="mid">
    <div class="cal">
      <div class="calhead">
        <h2 id="monthTitle"></h2>
        <div class="note" id="calNote"></div>
      </div>
      <div class="dow" id="dow"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="side">
      <div class="pane">
        <h3>今日 · <span id="todayLabel"></span></h3>
        <div class="evlist" id="todayList"></div>
      </div>
      <div class="pane">
        <h3>即將到來</h3>
        <div class="evlist" id="upList"></div>
        <div class="addbar">
          <input class="d1" id="nd" type="date">
          <input class="t1" id="nt" type="time">
          <input class="n1" id="nn" type="text" placeholder="新增事項…" maxlength="80">
          <button id="addBtn">加入</button>
        </div>
        <div class="warn" id="authWarn"></div>
      </div>
    </div>
  </div>
</div>

<pre id="boot" style="color:#8a93a6;padding:24px;font-size:13px"></pre>

<script src="config.js"></script>
<script src="calendar.js"></script>
</body>
</html>
